# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the config file:
#
# - `sheldon add` to add a new plugin to the config file
# - `sheldon edit` to open up the config file in the default editor
# - `sheldon remove` to remove a plugin from the config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"


[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[templates]
# `defer` byte-compiles; zcompile writes the .zwc next to the source, which is
# fine for the github plugins under ~/.local/share/sheldon (per machine). The
# `local` entries are sourced as is: ~/.config/zsh is the shared dotfiles tree,
# and all of these files are far under the ~15KB where zcompile starts to pay.
defer = """{{ hooks?.pre | nl }}{% for file in files %}
zsh-defer source_zcompile "{{ file }}"
{% endfor %}{{ hooks?.post | nl }}"""
defer_source = """{{ hooks?.pre | nl }}{% for file in files %}
zsh-defer source "{{ file }}"
{% endfor %}{{ hooks?.post | nl }}"""


[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
apply = ["defer"]

[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ["defer"]

[plugins.zshrc-sync]
local = '~/.config/zsh'
use = ['sync.zsh']

[plugins.zshrc-local-sync]
local = '~/.config/zsh.site'
use = ['sync.zsh']

[plugins.zshrc-defer]
local = '~/.config/zsh'
use = ['defer.zsh']
apply = ['defer_source']

[plugins.zshrc-local-defer]
local = '~/.config/zsh.site'
use = ['defer.zsh']
apply = ['defer_source']

[plugins.compinit]
inline = 'zsh-defer zcache_compinit'

[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
apply = ["defer"]

[plugins.zshrc-local-defer-after-compinit]
local = '~/.config/zsh.site'
use = ['defer-after-compinit.zsh']
apply = ['defer_source']

